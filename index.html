<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シェード</title>
<meta name="description" content="電動ルーフシェードを声のコマンドで動かすボタン（非公式）">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シェード">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- One source for both copies: this repo (github.com/takatronix/kiki) is the public app; the car web
     (tesla-pi4 /shade) is built from it by web/shade_sync.py, which adds its left menu and drops the service worker.
     Every button plays one clip (clips/<id>.mp3): "Hello KiKi", ~2.2 s while KiKi answers, the English command. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-open" viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="3.5"/><path d="M4 17h16"/><path d="M12 6.5V13M9.2 10.4 12 13.2l2.8-2.8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="3.5"/><path d="M4 17h16"/><path d="M12 13.5V7M9.2 9.6 12 6.8l2.8 2.8"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="8.6" y="8.6" width="6.8" height="6.8" rx="1.4"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.6 17.6h4.8M10.5 20.6h3"/><path d="M12 5.2a5 5 0 0 0-3 9c.6.5.9 1.1.9 1.8v.2h4.2V16c0-.7.3-1.3.9-1.8a5 5 0 0 0-3-9z"/><path d="M12 1.6v1.1M4.6 4.6l.8.8M19.4 4.6l-.8.8M2.6 10.2h1.1M20.3 10.2h1.1"/></symbol>
    <symbol id="i-bulb-off" viewBox="0 0 24 24"><path d="M9.6 17.6h4.8M10.5 20.6h3"/><path d="M12 5.2a5 5 0 0 0-3 9c.6.5.9 1.1.9 1.8v.2h4.2V16c0-.7.3-1.3.9-1.8a5 5 0 0 0-3-9z"/><path d="M4.5 3.5l15 17"/></symbol>
    <symbol id="i-dim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 5.4v.6M12 18v.6M5.4 12h.6M18 12h.6M7.3 7.3l.4.4M16.3 16.3l.4.4M7.3 16.7l.4-.4M16.3 7.7l.4-.4"/></symbol>
    <symbol id="i-bright" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.2v2.6M12 19.2v2.6M2.2 12h2.6M19.2 12h2.6M5.1 5.1 6.9 6.9M17.1 17.1l1.8 1.8M5.1 18.9l1.8-1.8M17.1 6.9l1.8-1.8"/></symbol>
    <symbol id="i-vol-down" viewBox="0 0 24 24"><path d="M3.5 9.4h3.2L11 5.6v12.8l-4.3-3.8H3.5z"/><path d="M15 12h6"/></symbol>
    <symbol id="i-vol-up" viewBox="0 0 24 24"><path d="M3.5 9.4h3.2L11 5.6v12.8l-4.3-3.8H3.5z"/><path d="M15 12h6M18 9v6"/></symbol>
    <symbol id="i-rainbow" viewBox="0 0 24 24"><path d="M2.8 17.5a9.2 9.2 0 0 1 18.4 0M6.3 17.5a5.7 5.7 0 0 1 11.4 0M9.8 17.5a2.2 2.2 0 0 1 4.4 0"/></symbol>
    <symbol id="i-waves" viewBox="0 0 24 24"><path d="M2.5 8.5c1.6-1.6 3.2-1.6 4.8 0s3.2 1.6 4.8 0 3.2-1.6 4.8 0 3.2 1.6 4.6 0M2.5 15.5c1.6-1.6 3.2-1.6 4.8 0s3.2 1.6 4.8 0 3.2-1.6 4.8 0 3.2 1.6 4.6 0"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9.4" stroke-dasharray="2 2.6"/></symbol>
    <symbol id="i-gradual" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M3.8 15.5 15.5 3.8M3.8 10 10 3.8M9 20.3 20.3 9"/></symbol>
    <symbol id="i-magic" viewBox="0 0 24 24"><path d="M10 3.5l1.7 4.8 4.8 1.7-4.8 1.7L10 16.5l-1.7-4.8L3.5 10l4.8-1.7z"/><path d="M18 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
    <symbol id="i-sport" viewBox="0 0 24 24"><path d="M3.6 18a9 9 0 1 1 16.8 0"/><path d="M12 16.8l4.4-5.4"/><circle cx="12" cy="16.8" r="1.3"/><path d="M6.4 12.2h.1M8.2 8.4h.1M12 6.9h.1"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.4 16.6 12 7.6l3.6 9M9.7 13.4h4.6"/></symbol>
    <symbol id="i-duo" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5.6"/><circle cx="15" cy="12" r="5.6"/></symbol>
    <symbol id="i-ice" viewBox="0 0 24 24"><path d="M12 2.8v9M8.2 4.8l7.6 5M15.8 4.8l-7.6 5"/><path d="M2.5 17c1.6-1.6 3.2-1.6 4.8 0s3.2 1.6 4.8 0 3.2-1.6 4.8 0 3.2 1.6 4.6 0"/></symbol>
  </defs>
</svg>

<main id="app">
  <header class="top">
    <h1>シェード</h1>
    <p class="how">押すと「Hello KiKi」のあと、英語のコマンドを流します</p>
    <span id="play" class="pill" aria-live="polite"><span class="wave"><i></i><i></i><i></i><i></i></span>再生中</span>
  </header>
  <div id="err" role="alert"></div>

  <div class="layout">
    <section class="col-a">
      <figure class="hero" aria-label="シェードと照明の様子（最後に押した操作からの目安）">
        <svg id="car" viewBox="0 0 240 340" role="img">
          <defs>
            <linearGradient id="g-body" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#2a2d33"/><stop offset=".5" stop-color="#1d1f24"/><stop offset="1" stop-color="#2a2d33"/>
            </linearGradient>
            <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1b2738"/><stop offset=".55" stop-color="#0d131c"/><stop offset="1" stop-color="#141d2a"/>
            </linearGradient>
            <linearGradient id="g-glow" x1="0" y1="0" x2="0" y2="1">
              <stop id="glow-a" offset="0" stop-color="#fff"/><stop id="glow-b" offset="1" stop-color="#fff"/>
            </linearGradient>
            <filter id="f-blur" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
            <filter id="f-shadow" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
            <clipPath id="c-roof"><path d="M78 126C92 121 148 121 162 126 171 128 174 134 174 146V250C174 260 168 266 158 267 140 269 100 269 82 267 72 266 66 260 66 250V146C66 134 69 128 78 126z"/></clipPath>
          </defs>
          <!-- front of the car at the top -->
          <path d="M120 5l6 7h-12z" fill="#8c93a0"/>
          <text x="120" y="23" text-anchor="middle" font-size="11" fill="#8c93a0" font-weight="600">前</text>
          <ellipse cx="120" cy="182" rx="86" ry="150" fill="#000" opacity=".7" filter="url(#f-shadow)"/>
          <!-- mirrors -->
          <path d="M51 104l-15-6c-3 0-5 2-4 5l6 9 13 1zM189 104l15-6c3 0 5 2 4 5l-6 9-13 1z" fill="#2a2d33" stroke="#fff" stroke-opacity=".08"/>
          <!-- body: bonnet at the top, tail at the bottom -->
          <path d="M120 30C88 30 64 35 56 50 49 64 47 86 47 112V280C47 308 54 322 76 327 92 330 148 330 164 327 186 322 193 308 193 280V112C193 86 191 64 184 50 176 35 152 30 120 30z" fill="url(#g-body)" stroke="#fff" stroke-opacity=".1"/>
          <path d="M70 44C88 38 152 38 170 44M86 92C92 60 148 60 154 92" fill="none" stroke="#fff" stroke-opacity=".06"/>
          <!-- windscreen and rear window -->
          <path d="M70 120C72 103 78 95 90 92 110 89 130 89 150 92 162 95 168 103 170 120 150 116 90 116 70 120z" fill="url(#g-glass)"/>
          <path d="M76 276C96 279 144 279 164 276 162 292 156 300 146 302 128 304 112 304 94 302 84 300 78 292 76 276z" fill="url(#g-glass)"/>
          <g id="glow" opacity="0">
            <path id="glow-soft" d="M78 126C92 121 148 121 162 126 171 128 174 134 174 146V250C174 260 168 266 158 267 140 269 100 269 82 267 72 266 66 260 66 250V146C66 134 69 128 78 126z" fill="none" stroke="url(#g-glow)" stroke-width="10" filter="url(#f-blur)"/>
            <path id="glow-line" d="M78 126C92 121 148 121 162 126 171 128 174 134 174 146V250C174 260 168 266 158 267 140 269 100 269 82 267 72 266 66 260 66 250V146C66 134 69 128 78 126z" fill="none" stroke="url(#g-glow)" stroke-width="1.6" opacity=".9"/>
          </g>
          <!-- the glass roof, the cabin under it, and the shade -->
          <g clip-path="url(#c-roof)">
            <rect x="60" y="118" width="120" height="155" fill="#11161e"/>
            <g id="seats" fill="#4b505a" stroke="#000" stroke-opacity=".35">
              <!-- steering wheel (right-hand drive) -->
              <rect x="133" y="124" width="26" height="6" rx="3" fill="none" stroke="#5a606b" stroke-opacity="1" stroke-width="2.5"/>
              <rect x="78" y="138" width="34" height="30" rx="7"/><rect x="76" y="166" width="38" height="13" rx="5" fill="#5b616c"/><rect x="87" y="180" width="16" height="6" rx="3" fill="#5b616c"/>
              <rect x="128" y="138" width="34" height="30" rx="7"/><rect x="126" y="166" width="38" height="13" rx="5" fill="#5b616c"/><rect x="137" y="180" width="16" height="6" rx="3" fill="#5b616c"/>
              <rect x="76" y="207" width="88" height="28" rx="8"/><rect x="74" y="233" width="92" height="13" rx="5" fill="#5b616c"/>
              <path d="M105 210v22M135 210v22" stroke="#000" stroke-opacity=".3"/>
              <rect x="117" y="186" width="6" height="18" rx="2" fill="#3b4048"/>
            </g>
            <rect x="60" y="118" width="120" height="155" fill="#fff" opacity=".035"/>
            <rect id="fabric" x="60" y="262" width="120" height="0" fill="#3d4047"/>
            <rect id="hem" x="60" y="261" width="120" height="2.5" fill="#8a8f99"/>
          </g>
          <!-- the roller at the rear of the roof -->
          <rect x="70" y="262" width="100" height="7" rx="3.5" fill="#3d4047" stroke="#000" stroke-opacity=".45"/>
          <path d="M66 121C90 116 150 116 174 121" fill="none" stroke="#000" stroke-width="3" opacity=".6"/>
        </svg>
        <figcaption class="state">
          <span><i id="st-shade-dot" class="dot"></i><span id="st-shade">開いている</span></span>
          <span><i id="st-light-dot" class="dot"></i><span id="st-light">照明 白</span></span>
        </figcaption>
      </figure>

      <div class="primary">
        <button class="k big" data-id="open"><svg class="ic"><use href="#i-open"/></svg><b>開く</b><small>Open Shade</small></button>
        <button class="k big" data-id="close"><svg class="ic"><use href="#i-close"/></svg><b>閉じる</b><small>Close Shade</small></button>
        <button class="k big stop" data-id="stop"><svg class="ic"><use href="#i-stop"/></svg><b>止める</b><small>Stop Shade</small></button>
      </div>

      <div class="vol">
        <button class="k row" data-id="vol_down"><svg class="ic"><use href="#i-vol-down"/></svg><span><b>音量を下げる</b><small>Volume down</small></span></button>
        <button class="k row" data-id="vol_up"><svg class="ic"><use href="#i-vol-up"/></svg><span><b>音量を上げる</b><small>Volume up</small></span></button>
      </div>
      <footer>非公式のツールです（EVNOVA とは関係ありません）。停車中に、まわりを確かめて使ってください。上の絵は最後に押した操作からの目安で、実際の状態ではありません。</footer>
    </section>

    <section class="col-b">
      <h2>照明</h2>
      <div class="lights">
        <button class="k row" data-id="lights_on"><svg class="ic"><use href="#i-bulb"/></svg><span><b>点灯</b><small>Turn on all lights</small></span></button>
        <button class="k row" data-id="lights_off"><svg class="ic"><use href="#i-bulb-off"/></svg><span><b>消灯</b><small>Turn off all lights</small></span></button>
        <button class="k row" data-id="bri_down"><svg class="ic"><use href="#i-dim"/></svg><span><b>暗く</b><small>Brightness down</small></span></button>
        <button class="k row" data-id="bri_up"><svg class="ic"><use href="#i-bright"/></svg><span><b>明るく</b><small>Brightness up</small></span></button>
      </div>
      <div class="bri">
        <button class="k end" data-id="bri_low"><b>最小</b><small>Lowest brightness</small></button>
        <div class="seg" id="seg">
          <button class="k lv" data-id="bri_1" data-en="Brightness one"><i></i><b>1</b></button>
          <button class="k lv" data-id="bri_2" data-en="Brightness two"><i></i><b>2</b></button>
          <button class="k lv" data-id="bri_3" data-en="Brightness three"><i></i><b>3</b></button>
          <button class="k lv" data-id="bri_4" data-en="Brightness four"><i></i><b>4</b></button>
          <button class="k lv" data-id="bri_5" data-en="Brightness five"><i></i><b>5</b></button>
          <button class="k lv" data-id="bri_6" data-en="Brightness six"><i></i><b>6</b></button>
          <button class="k lv" data-id="bri_7" data-en="Brightness seven"><i></i><b>7</b></button>
          <button class="k lv" data-id="bri_8" data-en="Brightness eight"><i></i><b>8</b></button>
          <button class="k lv" data-id="bri_9" data-en="Brightness nine"><i></i><b>9</b></button>
          <button class="k lv" data-id="bri_10" data-en="Brightness ten"><i></i><b>10</b></button>
          <small class="seg-en" id="seg-en">Brightness one 〜 ten</small>
        </div>
        <button class="k end" data-id="bri_high"><b>最大</b><small>Highest brightness</small></button>
      </div>

      <h2>色</h2>
      <div class="colors">
        <button class="k sw" data-id="red" style="--c:#ff453a"><i></i><b>赤</b><small>switch to <br>red</small></button>
        <button class="k sw" data-id="green" style="--c:#30d158"><i></i><b>緑</b><small>switch to <br>green</small></button>
        <button class="k sw" data-id="blue" style="--c:#2f6bff"><i></i><b>青</b><small>switch to <br>blue</small></button>
        <button class="k sw" data-id="white" style="--c:#f2f4ff"><i></i><b>白</b><small>switch to <br>white</small></button>
        <button class="k sw" data-id="purple" style="--c:#a35cff"><i></i><b>紫</b><small>switch to <br>purple</small></button>
        <button class="k sw" data-id="cyan" style="--c:#2ad4ee"><i></i><b>シアン</b><small>switch to <br>cyan</small></button>
        <button class="k sw" data-id="yellow" style="--c:#ffd60a"><i></i><b>黄</b><small>switch to <br>yellow</small></button>
        <button class="k sw" data-id="orange" style="--c:#ff9500"><i></i><b>オレンジ</b><small>orange <br>ambient</small></button>
        <button class="k sw" data-id="pink" style="--c:#ff6fae"><i></i><b>ピンク</b><small>pink <br>ambient</small></button>
      </div>

      <h2>動き</h2>
      <div class="modes">
        <button class="k md" data-id="rainbow"><svg class="ic"><use href="#i-rainbow"/></svg><span><b>レインボー</b><small>Rainbow ambient</small></span><i class="fx fx-rainbow"></i></button>
        <button class="k md" data-id="flowing"><svg class="ic"><use href="#i-waves"/></svg><span><b>流れる</b><small>Flowing ambient</small></span><i class="fx fx-flowing"></i></button>
        <button class="k md" data-id="breathing"><svg class="ic"><use href="#i-pulse"/></svg><span><b>呼吸</b><small>Breathing ambient</small></span><i class="fx fx-breathing"></i></button>
        <button class="k md" data-id="gradual"><svg class="ic"><use href="#i-gradual"/></svg><span><b>グラデーション</b><small>Gradual ambient</small></span><i class="fx fx-gradual"></i></button>
        <button class="k md" data-id="magic"><svg class="ic"><use href="#i-magic"/></svg><span><b>マジック</b><small>Magic ambient</small></span><i class="fx fx-magic"></i></button>
        <button class="k md" data-id="sport"><svg class="ic"><use href="#i-sport"/></svg><span><b>スポーツ</b><small>Sport ambient</small></span><i class="fx fx-sport"></i></button>
        <button class="k md" data-id="auto"><svg class="ic"><use href="#i-auto"/></svg><span><b>オート</b><small>Auto ambient</small></span><i class="fx fx-auto"></i></button>
      </div>
      <h3>対応機種のみ</h3>
      <div class="modes">
        <button class="k md" data-id="grad_rb"><svg class="ic"><use href="#i-duo"/></svg><span><b>赤と青</b><small>Red blue gradient</small></span><i class="fx fx-rb"></i></button>
        <button class="k md" data-id="grad_rg"><svg class="ic"><use href="#i-duo"/></svg><span><b>赤と緑</b><small>Red green gradient</small></span><i class="fx fx-rg"></i></button>
        <button class="k md" data-id="grad_bg"><svg class="ic"><use href="#i-duo"/></svg><span><b>青と緑</b><small>Blue green gradient</small></span><i class="fx fx-bg"></i></button>
        <button class="k md" data-id="ice_flow"><svg class="ic"><use href="#i-ice"/></svg><span><b>水色の流れ</b><small>Ice blue flow</small></span><i class="fx fx-ice"></i></button>
      </div>
    </section>
  </div>

</main>
<audio id="audio" preload="auto" playsinline></audio>
<script src="app.js"></script>
</body>
</html>
